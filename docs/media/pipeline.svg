<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#c9c8c3;stroke-width:1.2}
      .t{font-size:14px;font-weight:700;fill:#0b0b0b}
      .s{font-size:11.5px;fill:#52514e}
      .k{font-size:11px;font-weight:700;letter-spacing:.08em;fill:#8a8984}
      .ln{stroke:#52514e;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .dash{stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1000" height="560" rx="14" fill="#fcfcfb"/>

  <!-- column headers -->
  <text x="40" y="38" class="k">DATA</text>
  <text x="250" y="38" class="k">FORECASTERS</text>
  <text x="560" y="38" class="k">SELF-IMPROVEMENT LOOPS</text>
  <text x="830" y="38" class="k">OUTPUT</text>

  <!-- data -->
  <rect x="30" y="60" width="180" height="120" rx="10" class="box"/>
  <text x="44" y="86" class="t">GPU price pack</text>
  <text x="44" y="106" class="s">37 daily median prices</text>
  <text x="44" y="122" class="s">+ every offer on each list</text>
  <text x="44" y="138" class="s">3 trackers · to 6 Nov 2026</text>
  <text x="44" y="162" class="s" style="fill:#2a78d6">no data after each step's date</text>

  <rect x="30" y="200" width="180" height="96" rx="10" class="box"/>
  <text x="44" y="226" class="t">AWS spot history</text>
  <text x="44" y="246" class="s">19 machine types, 4 years</text>
  <text x="44" y="262" class="s">2nd test bed · RL practice</text>
  <text x="44" y="278" class="s">coach practice days</text>

  <rect x="30" y="316" width="180" height="80" rx="10" class="box"/>
  <text x="44" y="342" class="t">Shuffled worlds</text>
  <text x="44" y="362" class="s">price changes re-timed:</text>
  <text x="44" y="378" class="s">nothing real to learn</text>

  <!-- forecasters -->
  <rect x="250" y="60" width="250" height="78" rx="10" class="box" style="stroke:#2a78d6;stroke-width:2"/>
  <text x="264" y="86" class="t">Engine (no AI)</text>
  <text x="264" y="106" class="s">replays each offer's past moves onto</text>
  <text x="264" y="122" class="s">today's list, recomputes the median</text>

  <rect x="250" y="152" width="250" height="78" rx="10" class="box" style="stroke:#1baf7a;stroke-width:2"/>
  <text x="264" y="178" class="t">Five AI agents</text>
  <text x="264" y="198" class="s">list reader · repricer watcher · base rates</text>
  <text x="264" y="214" class="s">reference weigher · jump spotter → average</text>

  <rect x="250" y="244" width="250" height="62" rx="10" class="box" style="stroke:#eb6834;stroke-width:2"/>
  <text x="264" y="270" class="t">RL-trained open models</text>
  <text x="264" y="290" class="s">Qwen3-8B · Qwen3.5-9B (Tinker, Modal)</text>

  <rect x="250" y="320" width="250" height="62" rx="10" class="box"/>
  <text x="264" y="346" class="t">Chronos-2 (pretrained ML)</text>
  <text x="264" y="366" class="s">as it comes, on a Modal GPU</text>

  <!-- loops -->
  <rect x="540" y="60" width="250" height="78" rx="10" class="box"/>
  <text x="554" y="86" class="t">AI scientist → engine dials</text>
  <text x="554" y="106" class="s">one hypothesis at a time · gated</text>
  <text x="554" y="122" class="s" style="fill:#eb6834">did not help on unseen weeks</text>

  <rect x="540" y="152" width="250" height="78" rx="10" class="box" style="stroke:#1baf7a;stroke-width:2"/>
  <text x="554" y="178" class="t">Coach → agent crowd</text>
  <text x="554" y="198" class="s">10 changes proposed, 2 kept</text>
  <text x="554" y="214" class="s" style="fill:#1baf7a">+3–4% more on fresh exam days</text>

  <rect x="540" y="244" width="250" height="62" rx="10" class="box"/>
  <text x="554" y="270" class="t">RL forecaster training</text>
  <text x="554" y="290" class="s" style="fill:#1baf7a">3% → 5–11% less error than drift</text>

  <rect x="540" y="320" width="250" height="62" rx="10" class="box"/>
  <text x="554" y="346" class="t">Memory · analyst · recall probe</text>
  <text x="554" y="366" class="s">small or no gain; all reported</text>

  <!-- gate -->
  <rect x="250" y="420" width="540" height="110" rx="12" fill="#f3f2ee" stroke="#c9c8c3"/>
  <text x="270" y="448" class="t">Fixed test harness (the AI cannot change it)</text>
  <text x="270" y="470" class="s">• Scores pinball loss exactly as the organisers' starter/scorer.py does (parity test)</text>
  <text x="270" y="488" class="s">• A change is kept only if it helps on practice days and passes a hidden check</text>
  <text x="270" y="506" class="s">• Time machine: each version frozen, then scored on weeks it never saw · protocol committed first</text>

  <!-- output -->
  <rect x="830" y="152" width="145" height="96" rx="10" fill="#1baf7a"/>
  <text x="845" y="180" font-size="14" font-weight="700" fill="#fff">Forecast file</text>
  <text x="845" y="200" font-size="11.5" fill="#fff">6 Nov 2026 origin</text>
  <text x="845" y="216" font-size="11.5" fill="#fff">37 prices × 1/3/7 days</text>
  <text x="845" y="232" font-size="11.5" fill="#fff">q10 · q50 · q90</text>

  <rect x="830" y="270" width="145" height="80" rx="10" class="box"/>
  <text x="845" y="296" class="t">Long view</text>
  <text x="845" y="314" class="s">H100/A100 rent and</text>
  <text x="845" y="330" class="s">resale, 1–3 years</text>

  <!-- arrows -->
  <path d="M210 110 H250" class="ln"/>
  <path d="M210 120 Q230 160 250 185" class="ln"/>
  <path d="M210 248 Q230 270 250 275" class="ln"/>
  <path d="M210 356 Q232 400 250 440" class="ln dash"/>
  <path d="M540 99 H500" class="ln"/>
  <path d="M540 191 H500" class="ln"/>
  <path d="M540 275 H500" class="ln"/>
  <path d="M665 382 V420" class="ln dash"/>
  <path d="M790 191 H830" class="ln" style="stroke:#1baf7a;stroke-width:2.2"/>
  <text x="796" y="183" class="s" font-size="10">crowd</text>
</svg>
