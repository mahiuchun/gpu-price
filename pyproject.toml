[project]
name = "gpuval"
version = "0.1.0"
description = "A self-improving AI scientist for short-horizon GPU rental price forecasts"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "openai>=1.50",
    "modal>=1.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.10.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpuval"]
